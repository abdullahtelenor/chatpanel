<!DOCTYPE html>
<html lang="nb">
 
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for People Portal</title>
 
    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
        }
 
        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
        }
    </style>
</head>
 
<body>
 
    <script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
    <script>
        (function () {
            const boost = window.boostInit("tss");
            const CONV_KEY = "boostai.conversation.id";
 
            const hasSaml = () =>
                new URLSearchParams(location.search).has("saml_code");
 
            const ssoUrl = () => {
                const qs = new URLSearchParams({ sso: "", RelayState: location.href });
                const url = new URL("https://tss.boost.ai/api/auth/saml2/");
                url.search = qs.toString();
                return url.toString();
            };
 
            const redirectToSso = () => location.replace(ssoUrl());

            const notificationSound = new Audio('https://cdn.pixabay.com/audio/2022/10/16/audio_12b8c1b9b4.mp3');
 
            function showChatBadge() {
            let badge = document.getElementById('chat-badge');
            if (!badge) {
                badge = document.createElement('div');
                badge.id = 'chat-badge';
                // Position the badge in lower right but shifted further left and up
                badge.style.position = 'fixed';
                badge.style.bottom = '110px'; // Move higher so it is above the chat panel
                badge.style.right = '90px';   // Move left so it is not behind the panel
                badge.style.width = '24px';
                badge.style.height = '24px';
                badge.style.background = 'red';
                badge.style.borderRadius = '50%';
                badge.style.zIndex = '2147483647'; // Maximum z-index to be on top
                badge.style.display = 'flex';
                badge.style.alignItems = 'center';
                badge.style.justifyContent = 'center';
                badge.style.color = 'white';
                badge.style.fontSize = '16px';
                badge.style.fontWeight = 'bold';
                badge.style.boxShadow = '0 2px 6px rgba(0,0,0,0.3)';
                badge.textContent = '!';
                document.body.appendChild(badge);
            } else {
                badge.style.display = 'flex';
            }
        }
            function hideChatBadge() {
                let badge = document.getElementById('chat-badge');
                if (badge) badge.style.display = 'none';
            }
 
            // Listen for messageReceived (works for both VA and human agent)
            boost.chatPanel.addEventListener('messageReceived', function(ev) {
                // Always play sound & show badge when a new message is received (not user-sent)
                notificationSound.play();
                showChatBadge();
            });
 
            // Hide badge when user opens chat (optional)
            boost.chatPanel.addEventListener("chatPanelOpened", hideChatBadge);
 
            // Also hide badge when user sends a message
            boost.chatPanel.addEventListener("messageSent", hideChatBadge);

         
 
            /* ---------- SSO verify / redirect (runs only after user opens panel) ---------- */
            boost.chatPanel.addEventListener("chatPanelOpened", () => {
                if (hasSaml()) return; // already logged in → nothing to do
 
                const convId = localStorage.getItem(CONV_KEY);
                const ssoAttempted = sessionStorage.getItem("ssoAttempted");
 
                if (!convId && !ssoAttempted) {
                    sessionStorage.setItem("ssoAttempted", "true");
                    redirectToSso();
                    return;
                }
 
                fetch("https://tss.boost.ai/api/auth/saml2/verify_front_session_id/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=UTF-8" },
                    body: JSON.stringify({ conversation_id: convId })
                }).then(res => {
                    if (res.status === 403) {
                        localStorage.removeItem(CONV_KEY);
                        sessionStorage.removeItem("ssoAttempted");
                        redirectToSso();
                    }
                });
            });
 
            // ✅ Reset SSO attempt when chat is closed
            boost.chatPanel.addEventListener("chatPanelClosed", () => {
                sessionStorage.removeItem("ssoAttempted");
            });
 
            boost.chatPanel.addEventListener("setFilterValue", ev => {
                const v = ev.detail.filterValue;
                boost.chatPanel.setFilterValues(v);
                setTimeout(() => boost.chatPanel.setFilterValues(v), 500);
            });
 
            /* auto-open panel only if SSO already completed */
            if (hasSaml()) {
                boost.chatPanel.show();
            }
 
            // -----------------------------------------
            // Notification Sound on Message Received
            // -----------------------------------------
            // URL for public notification sound
           const NOTIF_SOUND_URL = "https://orangefreesounds.com/wp-content/uploads/2022/06/Simple-notification-sound.mp3";
           
           // Listen for incoming messages
           boost.chatPanel.addEventListener("messageReceived", (event) => {
               const msg = event.detail;
               console.log("New bot message:", msg);
       
               // Play the shared public-domain sound
               const audio = new Audio(NOTIF_SOUND_URL);
               audio.play().catch(err => console.warn("Audio blocked:", err));
       
               // Add notification badge to chat icon
               const chatIcon = document.querySelector("#chat-icon");
               if (chatIcon && !chatIcon.classList.contains("has-notification")) {
                   chatIcon.classList.add("has-notification");
               }
            
           });
           
           // Clear notification badge when panel is opened
           boost.chatPanel.addEventListener("chatPanelOpened", () => {
               const chatIcon = document.querySelector("#chat-icon");
               if (chatIcon) {
                   chatIcon.classList.remove("has-notification");
               }
           });

 
        })();
    </script>
 
</body>
 
</html>
