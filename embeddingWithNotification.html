<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Chat Panel for People Portal</title>
<style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
        }
</style>
</head>
<body>
<script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
<script>
        (function () {
            const boost = window.boostInit("tss");
            const CONV_KEY = "boostai.conversation.id";
 
            // --- SSO logic ---
            const hasSaml = () =>
                new URLSearchParams(location.search).has("saml_code");
 
            const ssoUrl = () => {
                const qs = new URLSearchParams({ sso: "", RelayState: location.href });
                const url = new URL("https://tss.boost.ai/api/auth/saml2/");
                url.search = qs.toString();
                return url.toString();
            };
 
            const redirectToSso = () => location.replace(ssoUrl());
 
            boost.chatPanel.addEventListener("chatPanelOpened", () => {
                if (hasSaml()) return; // already logged in → nothing to do
 
                const convId = localStorage.getItem(CONV_KEY);
                const ssoAttempted = sessionStorage.getItem("ssoAttempted");
 
                if (!convId && !ssoAttempted) {
                    sessionStorage.setItem("ssoAttempted", "true");
                    redirectToSso();
                    return;
                }
 
                fetch("https://tss.boost.ai/api/auth/saml2/verify_front_session_id/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json; charset=UTF-8" },
                    body: JSON.stringify({ conversation_id: convId })
                }).then(res => {
                    if (res.status === 403) {
                        localStorage.removeItem(CONV_KEY);
                        sessionStorage.removeItem("ssoAttempted");
                        redirectToSso();
                    }
                });
            });
 
            boost.chatPanel.addEventListener("chatPanelClosed", () => {
                sessionStorage.removeItem("ssoAttempted");
            });
 
            boost.chatPanel.addEventListener("setFilterValue", ev => {
                const v = ev.detail.filterValue;
                boost.chatPanel.setFilterValues(v);
                setTimeout(() => boost.chatPanel.setFilterValues(v), 500);
            });
 
            if (hasSaml()) {
                boost.chatPanel.show();
            }
 
            // --- Notification Badge & Sound ---
 
            const notificationSound = new Audio('https://cdn.pixabay.com/audio/2022/10/16/audio_12b8c1b9b4.mp3');
 
            // Wait for chat launcher, attach badge
            function attachBadgeToLauncher() {
                // The launcher is usually a button with class 'boost-chat-panel-launcher'
                let launcher = document.querySelector('.boost-chat-panel-launcher');
                if (!launcher) {
                    setTimeout(attachBadgeToLauncher, 500); // Try again in 0.5s
                    return;
                }
                let badge = launcher.querySelector('.chat-badge');
                if (!badge) {
                    badge = document.createElement('div');
                    badge.className = 'chat-badge';
                    badge.style.position = 'absolute';
                    badge.style.top = '0px';
                    badge.style.right = '0px';
                    badge.style.width = '18px';
                    badge.style.height = '18px';
                    badge.style.background = 'red';
                    badge.style.borderRadius = '50%';
                    badge.style.zIndex = '10';
                    badge.style.display = 'none';
                    badge.style.alignItems = 'center';
                    badge.style.justifyContent = 'center';
                    badge.style.color = 'white';
                    badge.style.fontSize = '12px';
                    badge.style.fontWeight = 'bold';
                    badge.style.boxShadow = '0 2px 6px rgba(0,0,0,0.3)';
                    badge.textContent = '!';
                    // Make launcher position:relative if needed
                    if (getComputedStyle(launcher).position === 'static') {
                        launcher.style.position = 'relative';
                    }
                    launcher.appendChild(badge);
                }
            }
            attachBadgeToLauncher();
 
            // Show badge
            function showChatBadge() {
                let launcher = document.querySelector('.boost-chat-panel-launcher');
                if (!launcher) return;
                let badge = launcher.querySelector('.chat-badge');
                if (badge) badge.style.display = 'flex';
            }
            // Hide badge
            function hideChatBadge() {
                let launcher = document.querySelector('.boost-chat-panel-launcher');
                if (!launcher) return;
                let badge = launcher.querySelector('.chat-badge');
                if (badge) badge.style.display = 'none';
            }
 
            // Play sound and show badge for ANY inbound message
            boost.chatPanel.addEventListener('messageReceived', function(ev) {
                notificationSound.play();
                showChatBadge();
            });
            // Hide badge when user opens chat
            boost.chatPanel.addEventListener("chatPanelOpened", hideChatBadge);
            // Hide badge when user sends message
            boost.chatPanel.addEventListener("messageSent", hideChatBadge);
 
        })();
</script>
</body>
</html>
