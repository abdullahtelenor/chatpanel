<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for People Portal</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
        }

        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
        }
    </style>
</head>

<body>

<script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
<script>

(function () {
  const CONV_KEY = "boostai.conversation.id";

  function getServiceNowTID() {
    // Dynamically fetch from your environment
    return "t991859"; 
  }

  const boost = window.boostInit("tss", {
    chatPanel: {
      header: {
        filters: { filterValues: ["ppapp"] }
      }
    }
  });

  // Function to initialize the payload
  const initializeBot = () => {
    const tid = getServiceNowTID();
    if (tid) {
      boost.chatPanel.setCustomPayload({ tid: tid });
      console.info("[Boost] Fresh TID injected:", tid);
    }
  };

  // 1. Initial Load
  initializeBot();

  // 2. Open Event
  boost.chatPanel.addEventListener("chatPanelOpened", () => {
    // If the session was cleared, this will now be a brand new conversation
    initializeBot();
  });

  // 3. THE "WASH OUT" LOGIC
  boost.chatPanel.addEventListener("chatPanelClosed", () => {
    console.warn("[Boost] Closing: Washing out session and payload...");
    
    // Completely clear the conversation ID from the browser
    localStorage.removeItem(CONV_KEY);
    
    // Clear the payload in the current instance
    boost.chatPanel.setCustomPayload({});
    
    // Optional: If you want to be extra aggressive, you can minimize the panel 
    // to ensure the internal state resets.
    console.info("[Boost] Session nuked. Next open will be fresh.");
  });

  // 4. Filter Logic
  boost.chatPanel.addEventListener("setFilterValue", ev => {
    const v = ev.detail.filterValue;
    boost.chatPanel.setFilterValues(v);
    setTimeout(() => boost.chatPanel.setFilterValues(v), 500);
  });

})();
  </script>
</body>
</html>
