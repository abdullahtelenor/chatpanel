<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for People Portal</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
        }

        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
        }
    </style>
</head>

<body>

<script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
<script>
(function () {
  console.group("[Boost Embed] Init");
  
  // Function to dynamically fetch TID from ServiceNow
  function getServiceNowTID() {
    return "t991859"; 
  }
  
  const boost = window.boostInit("tss", {
    chatPanel: {
      header: {
        filters: {
          filterValues: ["ppapp"]
        }
      }
    }
  });
  
  const CONV_KEY = "boostai.conversation.id";
  
  // ---- Initial payload on page load ----
  const initialTID = getServiceNowTID();
  if (initialTID) {
    boost.chatPanel.setCustomPayload({ tid: initialTID });
    console.info("[Boost Embed] Initial TID sent:", initialTID);
  }
  
  console.info("[Boost Embed] boostInit done");
  console.groupEnd();
  
  boost.chatPanel.addEventListener("chatPanelOpened", () => {
    console.group("[Boost Embed] Chat Opened");
    
    const convId = localStorage.getItem(CONV_KEY);
    const tidSent = sessionStorage.getItem("tidSent");
    
    console.info("[Boost Embed] convId:", convId);
    console.info("[Boost Embed] tidSent:", tidSent);
    
    // If no conversation → initial TID already set at page load
    if (!convId) {
      console.info("[Boost Embed] No conversation yet, using initial TID");
      console.groupEnd();
      return;
    }
    
    // If already sent for this conversation → skip
    if (tidSent === convId) {
      console.info("[Boost Embed] TID already sent for this conversation");
      console.groupEnd();
      return;
    }
    
    // Send TID and mark it as sent
    const tid = getServiceNowTID();
    if (tid) {
      boost.chatPanel.setCustomPayload({ tid: tid });
      sessionStorage.setItem("tidSent", convId);
      console.info("[Boost Embed] TID sent for conversation:", convId);
    }
    
    console.groupEnd();
  });
  
  boost.chatPanel.addEventListener("setFilterValue", ev => {
    const v = ev.detail.filterValue;
    boost.chatPanel.setFilterValues(v);
    setTimeout(() => boost.chatPanel.setFilterValues(v), 500);
  });
  
  // ---- Hard refresh on close ----
  boost.chatPanel.addEventListener("chatPanelClosed", () => {
    console.group("[Boost Embed] Chat Closed");
    
    // Clear everything
    boost.chatPanel.setCustomPayload({});
    localStorage.removeItem(CONV_KEY);
    sessionStorage.removeItem("tidSent");
    
    console.info("[Boost Embed] Triggering page reload...");
    console.groupEnd();
    
    // Hard refresh the page
    window.location.reload();
  });
})();
</script>
    
</body>
</html>
