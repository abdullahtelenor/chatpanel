<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for People Portal</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
        }

        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
        }
    </style>
</head>

<body>

<script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
<script>

(function () {
  const CONV_KEY = "boostai.conversation.id";

  function getServiceNowTID() {
    // Dynamically fetch from your environment
    return "t991859"; 
  }

  const boost = window.boostInit("tss", {
    chatPanel: {
      header: {
        filters: { filterValues: ["ppapp"] }
      }
    }
  });

  const sendPayload = (trigger) => {
    const tid = getServiceNowTID();
    if (tid) {
      boost.chatPanel.setCustomPayload({ tid: tid });
      console.log(`[Boost] Payload sent via ${trigger}:`, tid);
    }
  };

  // 1. Initial Load
  sendPayload("Init");

  // 2. Refresh on Open (With a slight delay to ensure the session is ready)
  boost.chatPanel.addEventListener("chatPanelOpened", () => {
    setTimeout(() => {
      sendPayload("Re-open");
    }, 100); 
  });

  // 3. Filter Logic
  boost.chatPanel.addEventListener("setFilterValue", ev => {
    const v = ev.detail.filterValue;
    boost.chatPanel.setFilterValues(v);
    setTimeout(() => boost.chatPanel.setFilterValues(v), 500);
  });

  // 4. RESET OPTION (Crucial if the first method still fails)
  // If the bot refuses to update an existing session, 
  // you may need to clear the session on close so it's ALWAYS "the first time".
  boost.chatPanel.addEventListener("chatPanelClosed", () => {
    // Only uncomment the line below if you want the chat history 
    // to disappear every time they close the window:
    localStorage.removeItem(CONV_KEY); 
    console.log("[Boost] Panel closed");
  });

})();
  </script>
</body>
</html>
