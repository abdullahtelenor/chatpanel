      function resize(height, width, options = {}) {
        let urlParams = new URLSearchParams(document.location.search);
        const iframe_id = urlParams.get("floating_iframe_id"); // Gets iframe ID
        console.log("iframe id is: "+iframe_id)
    
        window.parent.postMessage(
            {
                action: "resize",
                client_id: "5e2a0395-8258-456f-9c01-7f491529ca94",
                iframe_id: iframe_id,
                data: {
                    height: height, // Height in px
                    width: width, // Width in px
                    initial: options.initial, // Set to true at page load, false otherwise
                },
            },
            "*" // Replace * with the coupahost URL for enhanced security
        );
    }
    
   // Set initial size

    // Attach event listeners for chat panel close/minimize
            var config = {
                chatPanel: {
                    styling: { pace: "supersonic", position: { spacingBottom: 0, spacingRight: 0 } }
                },
                trigger: {
                    smallPositionX: 0,
                    smallPositionY: 0,
                    largePositionX: 0,
                    largePositionY: 0,
                }
            };
        
           var { chatPanel } = boost;
        
            chatPanel.addEventListener("chatPanelOpened", function () {
                console.log("Chat panel opened");
                resize(600, 400);
            }); 
        
            chatPanel.addEventListener("chatPanelClosed", function () {
                console.log("Chat panel closed");
                resize(64, 64); // Make the frame small again
            });
        
            chatPanel.addEventListener("chatPanelMinimized", function () {
                console.log("Chat panel minimized");
                resize(64, 64); // Shrink frame on minimize
            });
