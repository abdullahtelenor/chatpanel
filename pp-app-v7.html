<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for People Portal</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
        }

        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
        }
    </style>
</head>

<body>

<script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
<script>
(function () {
  console.group("[Boost Embed] Init");

  // Function to dynamically fetch TID from ServiceNow
  function getServiceNowTID() {
    // Replace with actual dynamic logic
    return "t991859";
  }

  const boost = window.boostInit("tss", {
    chatPanel: {
      header: {
        filters: {
          filterValues: ["ppapp"]
        }
      }
    }
  });

  // ---- Initial payload on page load ----
  let initialTID = getServiceNowTID();

  if (initialTID) {
    boost.chatPanel.setCustomPayload({ tid: initialTID });
    console.info("[Boost Embed] Initial TID sent:", initialTID);
  } else {
    console.warn("[Boost Embed] No TID found on page load");
  }

  console.info("[Boost Embed] boostInit done");
  console.groupEnd();


  // ---- Chat opened listener ----
  boost.chatPanel.addEventListener("chatPanelOpened", () => {
    console.group("[Boost Embed] Chat Opened");

    // If we already had a valid TID on load, no need to resend
    if (initialTID) {
      console.info("[Boost Embed] Initial TID already present, not resending.");
      console.groupEnd();
      return;
    }

    // Otherwise re-fetch it
    const serviceNowTID = getServiceNowTID();

    if (serviceNowTID) {
      boost.chatPanel.setCustomPayload({ tid: serviceNowTID });
      console.info("[Boost Embed] Re-sent TID on chat open:", serviceNowTID);
    } else {
      console.warn("[Boost Embed] Still no TID available on chat open");
    }

    console.groupEnd();
  });


  boost.chatPanel.addEventListener("setFilterValue", ev => {
    const v = ev.detail.filterValue;
    boost.chatPanel.setFilterValues(v);
    setTimeout(() => boost.chatPanel.setFilterValues(v), 500);
  });

})();
</script>
</body>
</html>
