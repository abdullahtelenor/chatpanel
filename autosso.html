<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Chat Panel for Coupa</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      height: 100vh;
      display: flex;
      justify-content: flex-end;
      align-items: flex-end;
      padding: 0;
    }
    .chat-icon {
      position: fixed;
      bottom: 0;
      right: 0;
      margin: 10px;
    }
  </style>
</head>
<body>

<script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
<script>
  console.log("🔄 Page loaded");

  const isLoggedIn = localStorage.getItem("boostLoggedIn");
  console.log("🔐 Login status from localStorage:", isLoggedIn);

  window.location.pathname;
  const relayState = encodeURIComponent(currentUrl);
  console.log("📍 Current URL:", currentUrl);
  console.log("📨 Encoded RelayState:", relayState);

  if (!isLoggedIn) {
    console.log("🚪 User not logged in. Redirecting to SSO...");
    localStorage.setItem("boostLoggedIn", "true"); // Set before redirect to avoid loop
    window.location.href = `https://tss.boost.ai/api/auth/saml2/?sso&RelayState=${relayState}`;
  } else {
    console.log("✅ User is logged in. Initializing Boost chat panel...");
    const boost = window.boostInit("tss");

    boost.chatPanel.addEventListener("setFilterValue", (ev) => {
      const value = ev.detail.filterValue;
      console.log("🎯 Filter value received:", value);
      boost.chatPanel.setFilterValues(value);
      setTimeout(() => {
        boost.chatPanel.setFilterValues(value);
      }, 500);
    });

    boost.chatPanel.show();
    console.log("💬 Chat panel shown");
  }
</script>

</body>
</html>
