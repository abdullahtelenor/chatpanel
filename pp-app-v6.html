<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for People Portal</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
        }

        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
        }
    </style>
</head>

<body>

<script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
<script>
(function () {
  console.group("[Boost Embed] Init");

  // Function to dynamically fetch TID from ServiceNow
  function getServiceNowTID() {
    // Replace this with the actual dynamic fetch logic
    return "t991859"; 
  }

  const boost = window.boostInit("tss", {
    chatPanel: {
      header: {
        filters: {
          filterValues: ["ppapp"]
        }
      }
    }
  });

  // ---- Initial payload on page load ----
  const initialTID = getServiceNowTID();
  if (initialTID) {
    boost.chatPanel.setCustomPayload({ tid: initialTID });
    console.info("[Boost Embed] Initial TID sent:", initialTID);
  }

  const tidSent = sessionStorage.getItem("tidSent");
  console.info("[Boost Embed] boostInit done");
  console.groupEnd();


  // ---- Re-send TID every time chat is opened ----
  boost.chatPanel.addEventListener("chatPanelOpened", () => {
    console.group("[Boost Embed] Chat Opened");

    const serviceNowTID = getServiceNowTID(); // re-fetch dynamically

    if (serviceNowTID) {
      boost.chatPanel.setCustomPayload({ tid: serviceNowTID });
      console.info("[Boost Embed] Re-sent TID on chat open:", serviceNowTID);
    } else {
      console.warn("[Boost Embed] No TID found on chat open");
    }

    console.groupEnd();
  });


  boost.chatPanel.addEventListener("setFilterValue", ev => {
    const v = ev.detail.filterValue;
    boost.chatPanel.setFilterValues(v);
    setTimeout(() => boost.chatPanel.setFilterValues(v), 500);
  });

  boost.chatPanel.addEventListener("chatPanelClosed", () => {
    console.group("[Boost Embed] Chat Closed");

    // Clear TID variable
    initialTID = "";

    // Clear custom payload inside Boost
    boost.chatPanel.setCustomPayload({});

    // Remove session flag
    sessionStorage.removeItem("tidSent");

    console.info("[Boost Embed] TID and custom payload cleared");

    console.groupEnd();
});

})();
</script>
</body>
</html>
