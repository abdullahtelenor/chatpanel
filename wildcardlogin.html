<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for coupa</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
            /* Adjust as needed */
        }

        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
            /* Optional spacing */
        }
    </style>
</head>

<body>


    <script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
    <script>
      const TENANT = "tss";
const SAML_ENDPOINT = "https://tss.boost.ai/api/auth/saml2/";
const VERIFY_ENDPOINT = SAML_ENDPOINT + "verify_front_session_id/";

// (1) after SAML login, boost should emit your session/conversation ID
function listenForSession(boost) {
  boost.chatPanel.addEventListener("sessionInitialized", function(ev) {
    window.localStorage.setItem(
      "boostai.conversation.id",
      ev.detail.sessionId
    );
  });
}

function buildRedirectUrl() {
  const query = new URLSearchParams({
    sso: "",
    RelayState: window.location.href,
  });
  const url = new URL(SAML_ENDPOINT);
  url.search = query.toString();
  return url;
}

function verifySession(callback) {
  const existingConversationId = window.localStorage.getItem(
    "boostai.conversation.id"
  );

  if (!existingConversationId) {
    callback(false);
    return;
  }

  fetch(VERIFY_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json; charset=UTF-8" },
    body: JSON.stringify({ conversation_id: existingConversationId }),
  })
    .then((res) => callback(res.status !== 403))
    .catch(() => callback(false));
}

// (2) enforce-then-open vs. redirect
function handleChatOpen(boost) {
  verifySession(function(isValid) {
    if (isValid) {
      // user is good—just show the panel
      boost.chatPanel.show();
    } else {
      // no valid session → go to SAML
      window.location.replace(buildRedirectUrl());
    }
  });
}

function attachChatEvents(boost) {
  // listen for the moment you get your session ID
  listenForSession(boost);

  // when user clicks “open chat,” check then show or redirect
  boost.chatPanel.addEventListener("chatPanelOpened", function() {
    handleChatOpen(boost);
  });

  // filter-value hack stays the same
  boost.chatPanel.addEventListener("setFilterValue", function(ev) {
    const v = ev.detail.filterValue;
    boost.chatPanel.setFilterValues(v);
    setTimeout(() => boost.chatPanel.setFilterValues(v), 500);
  });

  // if you already have a valid session on page‐load, show immediately
  verifySession((isValid) => {
    if (isValid) {
      boost.chatPanel.show();
    }
  });
}

const boostMaybe = window.boostInit(TENANT);
if (boostMaybe && typeof boostMaybe.then === "function") {
  boostMaybe.then(attachChatEvents);
} else if (boostMaybe) {
  attachChatEvents(boostMaybe);
}

// clean up SAML params on return
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get("saml_code")) {
  urlParams.delete("saml_code");
  urlParams.delete("RelayState");
  const cleanUrl =
    window.location.pathname +
    (urlParams.toString() ? "?" + urlParams.toString() : "") +
    window.location.hash;
  window.history.replaceState(null, "", cleanUrl);
}






    </script>

</body>

</html>
