<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for coupa</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
            /* Adjust as needed */
        }

        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
            /* Optional spacing */
        }
    </style>
</head>

<body>

    <script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
    <script>

        (function () {
            /* Boot the widget immediately — even before login */
            const boost = window.boostInit("tss");

            /* Local-storage flag to remember if the user has ever opened the panel */
            const LS_AUTO_OPEN_KEY = "boostai.chatPanel.autoOpen"; // "true" | null

            /* Helper: build the SSO redirect URL */
            function buildSsoUrl() {
                const qs = new URLSearchParams({
                    sso: "",
                    RelayState: window.location.href,
                });
                const url = new URL("https://tss.boost.ai/api/auth/saml2/");
                url.search = qs.toString();
                return url.toString();
            }

            /* Fires every time the user opens the chat panel */
            boost.chatPanel.addEventListener("chatPanelOpened", () => {
                /* Remember that this user clicked the panel at least once */
                localStorage.setItem(LS_AUTO_OPEN_KEY, "true");

                /* Kick off (or verify) SSO only after the panel is opened */
                const query = new URLSearchParams(location.search);
                if (query.get("saml_code")) return; // already authenticated

                const conversationId = localStorage.getItem("boostai.conversation.id");

                if (conversationId) {
                    /* Verify existing session */
                    fetch("https://tss.boost.ai/api/auth/saml2/verify_front_session_id/", {
                        method: "POST",
                        headers: { "Content-Type": "application/json; charset=UTF-8" },
                        body: JSON.stringify({ conversation_id: conversationId }),
                    }).then((res) => {
                        if (res.status === 403) location.replace(buildSsoUrl());
                        /* else → valid session, stay on page */
                    });
                } else {
                    /* No stored session: start SSO flow */
                    location.replace(buildSsoUrl());
                }
            });

            /* Auto-open the panel ONLY if the user has opened it before */
            if (localStorage.getItem(LS_AUTO_OPEN_KEY) === "true") {
                boost.chatPanel.show();
            }

            /* Keep the existing filter-sync handler */
            boost.chatPanel.addEventListener("setFilterValue", (ev) => {
                const value = ev.detail.filterValue;
                boost.chatPanel.setFilterValues(value);                // immediate
                setTimeout(() => boost.chatPanel.setFilterValues(value), 500); // 500 ms later
            });
        })();
    </script>



    </script>

</body>

</html>
