<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for coupa</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px; /* Adjust as needed */
        }
        /* If you need a custom chat icon, uncomment and use this */
        /* .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
        } */
    </style>
</head>
<body>

<script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
<script>
    console.log("🔄 Page loaded");

    // Initialize boost once globally
    let boost;

    // Check if the URL contains a SAML response (indicating return from SSO)
    const urlParams = new URLSearchParams(window.location.search);
    const cameFromSSO = urlParams.has("SAMLResponse") || urlParams.has("RelayState");

    if (!cameFromSSO) {
        console.log("🚪 Not coming from SSO. Redirecting to login...");
        const currentUrl = window.location.origin + window.location.pathname;
        const relayState = encodeURIComponent(currentUrl);
        console.log("📨 Redirecting with RelayState:", relayState);
        window.location.href = `https://tss.boost.ai/api/auth/saml2/?sso&RelayState=${relayState}`;
    } else {
        console.log("✅ Returned from SSO. Initializing chat panel...");
        boost = window.boostInit("tss"); // Initialize boost object here

        // Add event listener only once
        if (boost && boost.chatPanel) {
            boost.chatPanel.addEventListener("setFilterValue", (ev) => {
                console.log("🎯 Filter value received:", ev.detail.filterValue);
                const value = ev.detail.filterValue;

                // Consider if the setTimeout is truly necessary
                boost.chatPanel.setFilterValues(value);
                // If the second call is NOT required, remove the setTimeout block
                /*
                setTimeout(() => {
                    boost.chatPanel.setFilterValues(value);
                }, 500);
                */
            });

            boost.chatPanel.show();
            console.log("💬 Chat panel shown");
        } else {
            console.error("❌ Failed to initialize Boost chat panel.");
        }
    }
</script>

</body>
</html>
