<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for coupa</title>
     
    <style>
        body {
             margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px; /* Adjust as needed */
        }
        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px; /* Optional spacing */
        }
    </style>
</head>
<body>
   

<script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
    <script>
      var boost = window.boostInit("tss");
    boost.chatPanel.addEventListener("setFilterValue", (ev) => {
        console.log("Event Triggered:", ev);
        const value = ev.detail.filterValue;
        boost.chatPanel.setFilterValues(value); // immediate
        setTimeout(() => {
            boost.chatPanel.setFilterValues(value); // after 500 ms
        }, 500);
    });
         //window.location.href = `https://tss.boost.ai/api/auth/saml2/?sso&RelayState=${window.location.href}`;
        //window.location.href = `https://tss.boost.ai/api/auth/saml2/?sso&RelayState=${window.location.origin}/`;
        window.location.href = `https://tss.boost.ai/api/auth/saml2/?sso&RelayState=${window.location.href}/`;
        setTimeout(()=>{console.log("Waitiing 0.2s");}, 200);
       
        boost.chatPanel.show()
</script>
    

</body>

</html>
