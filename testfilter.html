<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for coupa</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
            /* Adjust as needed */
        }

        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
            /* Optional spacing */
        }
    </style>
</head>

<body>

    <script src="https://tss.boost.ai/chatPanel/chatPanel.js"></script>
    <script>
        const customRedirectQuery = new URLSearchParams(document.location.search);
        if (!customRedirectQuery.get("saml_code")) {
            const existingConversationId = window.localStorage.getItem(
                "boostai.conversation.id",
            );

            const newQueryString = new URLSearchParams({
                sso: "",
                RelayState: window.location.href,
            });

            const redirectUrl = new URL("https://tss.boost.ai/api/auth/saml2/");

            redirectUrl.search = newQueryString.toString();

            if (existingConversationId) {
                fetch("https://tss.boost.ai/api/auth/saml2/verify_front_session_id/", {
                    method: "POST",

                    headers: {
                        "Content-Type": "application/json; charset=UTF-8",
                    },

                    body: JSON.stringify({ conversation_id: existingConversationId }),
                }).then((result) => {
                    if (result.status == 403) {
                        window.location.replace(redirectUrl);
                    } else {
                        var boost = window.boostInit("tss");
                    }
                });
            } else {
                window.location.replace(redirectUrl);
            }
        } else {
            var boost = window.boostInit("tss");
        }

        if(boost){
            boost.chatPanel.addEventListener("setFilterValue", (ev) => {
                const value = ev.detail.filterValue;
                boost.chatPanel.setFilterValues(value); // immediate
                setTimeout(() => {
                    boost.chatPanel.setFilterValues(value); // after 500 ms
                }, 500);
            });
            boost.chatPanel.show()
        }

    </script>

</body>

</html>
