<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PP-App</title>
  <style>
    body {
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }
    .overlay {
      background: rgba(0, 0, 0, 0.4);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
  </style>
</head>

<body>

<script src="https://tsstest.boost.ai/chatPanel/chatPanel.js"></script> 
<script>
  (function () {
    // ---------------------------------------------------------
    // STEP A: Retrieve the ServiceNow User ID (TID)
    // ---------------------------------------------------------
    // Your ServiceNow developer must inject the user's ID here.
    // If they render it server-side, it might look like: 
    // const serviceNowTID = "${current_user.user_name}";
    // Or if it's a global JS variable: window.NOW.user.userID;
    
    const serviceNowTID = "REPLACE_WITH_ACTUAL_SERVICENOW_TID"; 

    // ---------------------------------------------------------
    // STEP B: Initialize Boost with Custom Payload
    // ---------------------------------------------------------
    const boost = window.boostInit("tsstest", { 
      chatPanel: {
        header: {
          filters: {
            filterValues: ["ppapp"] 
          }
        },
        // This sends the data to Boost.ai
        customPayload: {
          "tid": serviceNowTID
        }
      }
    });

  })();
</script>
</body>

</html>
