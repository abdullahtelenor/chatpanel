<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for People Portal</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
        }

        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
        }
    </style>
</head>

<body>


<script src="https://tsstest.boost.ai/chatPanel/chatPanel.js"></script>
<script>
(function () {
  console.group("[Boost Embed] Init");

  let serviceNowTID = "t991859";

  console.info("[Boost Embed] TID:", serviceNowTID);

  // 1️⃣ INIT BOOST (ONCE)
  const boost = window.boostInit("tsstest", {
    chatPanel: {
      header: {
        filters: {
          filterValues: ["ppapp"]
        }
      }
    }
  });

  console.info("[Boost Embed] boostInit done");

  // 2️⃣ SET CUSTOM PAYLOAD *IMMEDIATELY*
  try {
    boost.chatPanel.setCustomPayload({
      tid: serviceNowTID
    });

    console.info(
      "[Boost Embed] Custom payload set:",
      boost.chatPanel.getCustomPayload?.()
    );
  } catch (err) {
    console.error("[Boost Embed] Failed to set payload", err);
  }

  // 3️⃣ DEBUG: confirm BEFORE chat starts
  setTimeout(() => {
    console.info(
      "[Boost Embed] Payload after delay:",
      boost.chatPanel.getCustomPayload?.()
    );
  }, 500);

  console.groupEnd();
})();
</script>


  </body>

</html>
