<!DOCTYPE html>
<html lang="nb">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
    <title>Chat Panel for People Portal</title>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: flex-end;
            align-items: flex-end;
            padding: 0px;
        }

        .chat-icon {
            position: fixed;
            bottom: 0;
            right: 0;
            margin: 10px;
        }
    </style>
</head>

<body>


<script src="https://tsstest.boost.ai/chatPanel/chatPanel.js"></script>
<script>
(function () {
  console.group("[Boost Embed] Init");

  const serviceNowTID = "t991859";
  console.info("[Boost Embed] TID:", serviceNowTID);

  const boost = window.boostInit("tsstest", {
    chatPanel: {
      header: {
        filters: {
          filterValues: ["ppapp"]
        }
      }
    }
  });

  console.info("[Boost Embed] boostInit done");

  // ✅ EARLIEST DOCUMENTED SAFE EVENT
  boost.chatPanel.addEventListener("chatPanelOpened", () => {
    console.info("[Boost Embed] chatPanelOpened");

  let customPayload = { tid: serviceNowTID }; // include tId here if avaiable;

  boost.chatPanel.setCustomPayload(customPayload);
  console.log(customPayload);
    console.info("[Boost Embed] Custom payload SENT");
  });

  console.groupEnd();
})();
</script>



  </body>

</html>
